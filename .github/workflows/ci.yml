name: Reproducibility checks
on: [push, pull_request]
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m pip install 'ruff==0.14.2'
      - run: python -m ruff check scripts tests
      - run: python -m ruff format --check scripts tests
      - run: python -m pytest -q
      - run: python scripts/reproduce_public_results.py --out outputs/derived
      - run: python -m scripts.reproduce_patient_analysis --output outputs/patient_metrics
      - run: python -m scripts.reproduce_full_statistics --out outputs/reproduced
      - run: python -m scripts.reproduce_tables --out outputs/tables
      - run: python -m scripts.regenerate_partitions --out outputs/partitions.csv.gz
      - run: python -m scripts.reproduce_figures --out outputs/figures
      - run: python scripts/verify_checksums.py
      - run: python scripts/check_release.py
